name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug & Release APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Prepare APK outputs
        working-directory: ./android
        run: |
          mkdir -p output_apks
          # Find and copy debug APK
          DEBUG_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -n "$DEBUG_APK" ] && [ -f "$DEBUG_APK" ]; then
            cp "$DEBUG_APK" output_apks/verbose-ai-debug.apk
            echo "Copied debug APK"
          fi

          # Copy release APK (already signed with repository keystore via Gradle)
          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -n "$RELEASE_APK" ] && [ -f "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" output_apks/verbose-ai-release.apk
            echo "Copied release APK"
          fi
          ls -la output_apks/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: verbose-ai-debug
          path: android/output_apks/verbose-ai-debug.apk
          retention-days: 14

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: verbose-ai-release
          path: android/output_apks/verbose-ai-release.apk
          retention-days: 14

      - name: Create GitHub Release with APKs
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-apk
          name: "Verbose AI v1.0.0 Android APK"
          body: |
            ### Verbose AI Android Release v1.0.0

            Zero-hallucination literary intelligence companion for Android.

            #### Direct APK Downloads:
            - **[Download verbose-ai-debug.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.0-apk/verbose-ai-debug.apk)** (Instantly installable)
            - **[Download verbose-ai-release.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.0-apk/verbose-ai-release.apk)**

            *Built automatically via GitHub Actions CI/CD.*
          files: |
            android/output_apks/verbose-ai-debug.apk
            android/output_apks/verbose-ai-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
